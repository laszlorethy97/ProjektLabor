<main class="key-access">
  <header class="key-access__header">
    <h1 class="key-access__title">Kulcs átvétele</h1>
    <p class="key-access__subtitle">Add meg az email-címedet, a PIN-kódot és az átvenni kívánt kulcs kódját.</p>
  </header>

  <form class="key-access__form" #pickupForm="ngForm" (ngSubmit)="submit()">
    <div class="key-access__field">
      <label class="key-access__label" for="pickup-email">Email</label>
      <input
        class="key-access__input"
        id="pickup-email"
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
        required
      />
    </div>

    <div class="key-access__field">
      <label class="key-access__label" for="pickup-pin-code">PIN-kód</label>
      <input
        class="key-access__input"
        id="pickup-pin-code"
        type="text"
        name="pinCode"
        [(ngModel)]="pinCode"
        inputmode="numeric"
        autocomplete="one-time-code"
        required
      />
    </div>

    <div class="key-access__field">
      <label class="key-access__label" for="pickup-key">Kulcskód</label>
      <input
        class="key-access__input"
        id="pickup-key"
        type="text"
        name="keyCode"
        [(ngModel)]="keyCode"
        maxlength="25"
        required
      />
    </div>

    <button class="key-access__submit" type="submit" [disabled]="pickupForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Küldés...' : 'Kulcs átvétele' }}
    </button>

    @if (isSubmitting) {
      <p class="key-access__pending" role="status" aria-live="polite">
        A kulcs átvétele folyamatban van, várj a visszajelzésre.
      </p>
    }

    @if (isSubmitted) {
      <p class="key-access__success" role="status">A kulcs átvétele sikeres.</p>
    }

    @if (errorMessage) {
      <p class="key-access__error" role="alert">{{ errorMessage }}</p>
    }
  </form>
</main>
