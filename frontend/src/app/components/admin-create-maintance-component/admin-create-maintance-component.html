<main class="maintenance-form">
  <div class="maintenance-form__content">
    <header class="maintenance-form__header">
      <a class="maintenance-form__back" routerLink="/admin/maintenance">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 12H5m6 6-6-6 6-6"></path>
        </svg>
        Vissza a termekhez
      </a>
      <div class="maintenance-form__eyebrow">
        <span class="maintenance-form__mark" aria-hidden="true"></span>
        KARBANTARTÁS
      </div>
      <h1 class="maintenance-form__title">Karbantartás meghirdetése</h1>
      <p class="maintenance-form__subtitle">
        Add meg a {{ roomId }}. terem karbantartásának időszakát.
      </p>
    </header>

    <form class="maintenance-form__card" #maintenanceForm="ngForm" (ngSubmit)="requestMaintenance()">
      <input type="hidden" name="roomId" [ngModel]="roomId" />
      <section aria-labelledby="maintenance-dates-title">
        <div class="maintenance-form__section-heading">
          <span class="maintenance-form__step">01</span>
          <div>
            <h2 id="maintenance-dates-title" class="maintenance-form__section-title">
              Karbantartás időszaka
            </h2>
            <p class="maintenance-form__section-description">
              A kezdő és záró dátumot is add meg.
            </p>
          </div>
        </div>

        <div class="maintenance-form__fields">
          <div class="maintenance-form__field">
            <label class="maintenance-form__label" for="start-date">Kezdő dátum *</label>
            <input
              class="maintenance-form__input"
              id="start-date"
              name="startDate"
              type="date"
              required
              [max]="endDate || null"
              [(ngModel)]="startDate"
            />
          </div>

          <div class="maintenance-form__field">
            <label class="maintenance-form__label" for="end-date">Záró dátum *</label>
            <input
              class="maintenance-form__input"
              id="end-date"
              name="endDate"
              type="date"
              required
              [min]="startDate || null"
              [(ngModel)]="endDate"
            />
          </div>
        </div>
      </section>

      <footer class="maintenance-form__footer admin-form-footer">
        <p
          class="admin-form-status"
          [class.admin-form-status--error]="statusIsError"
          role="status"
        >
          {{ statusMessage }}
        </p>
        <button
          class="admin-form-submit"
          type="submit"
          [disabled]="maintenanceForm.invalid || roomId < 1"
        >
          Időszak bekérése
        </button>
      </footer>
    </form>
  </div>
</main>
